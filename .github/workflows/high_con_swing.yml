name: High-Conviction Swing Scanner

on:
  schedule:
    # 8:00 AM IST on weekdays (before market open) = 02:30 UTC, same time
    # as the other EOD swing screener since both use the previous trading
    # day's close -- only the delivery time changes.
    - cron: "30 2 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy yfinance tzdata

      - name: Run swing conviction scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python swing_conviction_scanner.py
