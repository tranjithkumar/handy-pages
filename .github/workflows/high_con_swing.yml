name: High-Conviction Swing Scanner

on:
  schedule:
    # 7:00 PM IST on weekdays (market days) = 13:30 UTC, same schedule as
    # the other EOD swing screener since both use end-of-day daily data.
    - cron: "30 13 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy yfinance

      - name: Run swing conviction scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python swing_conviction_scanner.py
