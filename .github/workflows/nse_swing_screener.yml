name: NSE Swing Screener

on:
  schedule:
    # 19:00 IST on weekdays (market days) = 13:30 UTC.
    # GitHub Actions cron is always UTC.
    - cron: "30 13 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy yfinance

      - name: Run screener
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python nse_swing_screener.py
