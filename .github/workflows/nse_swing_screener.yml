name: NSE Swing Screener

on:
  schedule:
    # 8:00 AM IST on weekdays (before market open) = 02:30 UTC.
    # Uses the PREVIOUS trading day's close, same data as an evening run
    # would have used -- only the delivery time changes.
    # GitHub Actions cron is always UTC.
    - cron: "30 2 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy yfinance tzdata

      - name: Run screener
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python nse_swing_screener.py
