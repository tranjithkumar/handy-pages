name: Swing Scanner

on:
  schedule:
    # Saturday 2:00 PM IST = 08:30 UTC
    - cron: '30 8 * * 6'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  swing:
    runs-on: ubuntu-latest

    # 🔥 THIS IS THE FIX (MANDATORY)
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install yfinance pandas numpy requests

      - name: Run Scanner
        run: |
          python scanner.py

      - name: Commit swing.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/swing.json

          git diff --staged --quiet || git commit -m "Weekly Swing Update"

          git push
