name: Monday Gap-RSI Scan

# Runs every Monday at 9:30 AM IST (04:00 UTC).
# GitHub's cron scheduler can lag by a few minutes during high load —
# that's fine here since the gap-open data it needs is already in by 9:15 AM IST.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:  # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write   # to commit outputs/ back to the repo
  issues: write     # to post the result as an Issue

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run screener
        run: python mongaprsi.py

      - name: Commit results back to repo
        run: |
          git config user.name "gap-rsi-bot"
          git config user.email "actions@github.com"
          git add outputs/
          git diff --quiet --cached || git commit -m "Scan result: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Post result as GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "scan-result" --color "0E8A16" --description "Automated gap-RSI scan output" 2>/dev/null || true
          gh issue create \
            --title "Gap-RSI Scan — $(date -u +'%Y-%m-%d')" \
            --body-file outputs/last_result.md \
            --label "scan-result"

      - name: Send result to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          MSG=$(cat outputs/last_result.md)
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            --data-urlencode text="$MSG"
