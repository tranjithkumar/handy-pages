<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWING</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background: #111827;
    color: white;
}

h2 {
    margin-bottom: 15px;
}

.status {
    margin-bottom: 15px;
    color: #9ca3af;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #374151;
    padding: 10px;
    text-align: left;
}

th {
    background: #1f2937;
}

tr:nth-child(even) {
    background: #1a2332;
}

button {
    margin-top: 20px;
    padding: 10px 15px;
    cursor: pointer;
}
</style>
</head>

<body>

<h2>SWING</h2>

<div id="status" class="status">
Loading...
</div>

<table>
<thead>
<tr>
    <th>Symbol</th>
    <th>Close</th>
    <th>1M %</th>
    <th>RSI</th>
    <th>52W Gap %</th>
    <th>OTM CE</th>
</tr>
</thead>

<tbody id="results">
<tr>
    <td colspan="6">Loading...</td>
</tr>
</tbody>
</table>

<button onclick="location.href='../index.html'">
Back
</button>

<script>

async function loadSwing() {

    try {

        const url = "../data/swing.json?v=" + Date.now(); // 🔥 CACHE FIX

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("HTTP Error " + response.status);
        }

        const data = await response.json();

        const status = document.getElementById("status");
        const tbody = document.getElementById("results");

        status.innerText = `${data.length} candidate(s) found`;

        tbody.innerHTML = "";

        if (!data || data.length === 0) {
            tbody.innerHTML = `
            <tr>
                <td colspan="6">No candidates found</td>
            </tr>`;
            return;
        }

        data.forEach(stock => {
            tbody.innerHTML += `
            <tr>
                <td>${stock.symbol}</td>
                <td>${stock.close}</td>
                <td>${stock.monthly_change}%</td>
                <td>${stock.rsi}</td>
                <td>${stock.high_gap}%</td>
                <td>${stock.strike}</td>
            </tr>`;
        });

    } catch (error) {

        document.getElementById("status").innerText =
            "Failed to load swing.json";

        console.error(error);
    }
}

// initial load
loadSwing();

</script>

</body>
    </html>
