<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handy Pages</title><style>
    body {
        font-family: Arial, sans-serif;
        padding: 40px;
        color: white;

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    .header {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    #market-status {
        color: #22c55e;
        font-size: 22px;
    }

    .welcome {
        font-size: 20px;
        font-weight: bold;
        color: #ffffff;
    }

    #quote {
        margin-top: 15px;
        margin-bottom: 30px;
        color: #d1d5db;
        font-style: italic;
    }

    button {
        width: 120px;
        height: 20px;
        font-size: 10px;
        cursor: pointer;
        display: block;
        margin-bottom: 15px;
    }
</style>

</head>
<body><div class="header">
    <span id="market-status">●</span>
    <span class="welcome">Welcome Back Boss</span>
</div>

<p id="quote"></p>

<button onclick="location.href='screeners/swing.html'">
    SWING
</button>

<button onclick="location.href='screeners/after2pm.html'">
    AFTER2PM
</button>

<script>
    const quotes = [
        "Protect capital first. Growth comes second.",
        "The market rewards discipline.",
        "Patience compounds.",
        "Strong trends require strong conviction."
    ];

    document.getElementById("quote").innerText =
        quotes[Math.floor(Math.random() * quotes.length)];

    const backgrounds = [
        "https://images.unsplash.com/photo-1500375592092-40eb2168fd21",
        "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
        "https://images.unsplash.com/photo-1446776877081-d282a0f896e2",
        "https://images.unsplash.com/photo-1465447142348-e9952c393450"
    ];

    document.body.style.backgroundImage =
        `url(${backgrounds[Math.floor(Math.random() * backgrounds.length)]})`;
</script>

</body>
</html>
