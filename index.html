<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handy Pages</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        padding: 40px;
        color: white;

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;

        background-color: #0f172a; /* fallback always */
    }

    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.45);
        z-index: -1;
    }

    .header {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #market-status {
        font-size: 10px;
    }

    .welcome {
        font-size: 18px;
        font-weight: bold;
    }

    #quote {
        margin-top: 15px;
        margin-bottom: 30px;
        color: #e5e7eb;
        font-style: italic;
        min-height: 20px;
    }

    button {
        width: 140px;
        height: 40px;
        font-size: 13px;
        cursor: pointer;
        display: block;
        margin-bottom: 12px;

        background: rgba(30,41,59,0.6);
        color: white;
        border: 1px solid #334155;
        border-radius: 6px;
    }

    button:hover {
        background: rgba(51,65,85,0.8);
    }
</style>
</head>

<body>

<div class="header">
    <span id="market-status">⚪</span>
    <span class="welcome">Welcome Back Boss</span>
</div>

<p id="quote">Loading quote...</p>

<button onclick="location.href='screeners/swing.html'">SWING</button>
<button onclick="location.href='screeners/after2pm.html'">AFTER2PM</button>

<script>

/* =========================
   MARKET STATUS
   ========================= */

function isMarketOpen() {
    const now = new Date();
    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    const ist = new Date(utc + (5.5 * 60 * 60 * 1000));

    const day = ist.getDay();
    const hour = ist.getHours();
    const min = ist.getMinutes();

    if (day === 0 || day === 6) return false;

    const current = hour * 60 + min;
    const open = 9 * 60 + 15;
    const close = 15 * 60 + 30;

    return current >= open && current <= close;
}

function updateMarketStatus() {
    const el = document.getElementById("market-status");

    if (isMarketOpen()) {
        el.textContent = "🟢";
        el.style.color = "#22c55e";
    } else {
        el.textContent = "⚪";
        el.style.color = "#9ca3af";
    }
}

updateMarketStatus();
setInterval(updateMarketStatus, 60000);


/* =========================
   BACKGROUND (100% STABLE)
   ========================= */

function setBg(url) {
    const img = new Image();

    img.onload = () => {
        document.body.style.backgroundImage = `url('${url}')`;
    };

    img.onerror = () => {
        document.body.style.backgroundImage = "none";
        document.body.style.backgroundColor = "#0f172a";
    };

    img.src = url;
}

/* Picsum = stable direct image CDN */
const url = "https://picsum.photos/1920/1080?random=" + Date.now();
setBg(url);


/* =========================
   QUOTE (NO API DEPENDENCY)
   ========================= */

const quoteEl = document.getElementById("quote");

const quotes = [
    "Discipline beats prediction",
    "Execution beats intention",
    "Consistency compounds everything",
    "Risk management is survival",
    "Focus on process, not outcome",
    "Small edges build big results",
    "Control downside, upside takes care of itself"
];

function loadQuote() {
    quoteEl.innerText = quotes[Math.floor(Math.random() * quotes.length)];
}

loadQuote();

</script>

</body>
</html>
