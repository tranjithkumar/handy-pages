<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handy Pages</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        padding: 40px;
        color: white;

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.45);
        z-index: -1;
    }

    .header {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #market-status {
        font-size: 10px;
    }

    .welcome {
        font-size: 18px;
        font-weight: bold;
    }

    #quote {
        margin-top: 15px;
        margin-bottom: 30px;
        color: #e5e7eb;
        font-style: italic;
        min-height: 20px;
    }

    button {
        width: 140px;
        height: 40px;
        font-size: 13px;
        cursor: pointer;
        display: block;
        margin-bottom: 12px;

        background: rgba(30,41,59,0.6);
        color: white;
        border: 1px solid #334155;
        border-radius: 6px;
    }

    button:hover {
        background: rgba(51,65,85,0.8);
    }
</style>
</head>

<body>

<div class="header">
    <span id="market-status">⚪</span>
    <span class="welcome">Welcome Back Boss</span>
</div>

<p id="quote">Loading quote...</p>

<button onclick="location.href='screeners/swing.html'">SWING</button>
<button onclick="location.href='screeners/after2pm.html'">AFTER2PM</button>

<script>

/* =========================
   MARKET STATUS
   ========================= */

function isMarketOpen() {
    const now = new Date();

    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    const ist = new Date(utc + (5.5 * 60 * 60 * 1000));

    const day = ist.getDay();
    const hour = ist.getHours();
    const min = ist.getMinutes();

    if (day === 0 || day === 6) return false;

    const current = hour * 60 + min;
    const open = 9 * 60 + 15;
    const close = 15 * 60 + 30;

    return current >= open && current <= close;
}

function updateMarketStatus() {
    const el = document.getElementById("market-status");

    if (isMarketOpen()) {
        el.textContent = "🟢";
        el.style.color = "#22c55e";
    } else {
        el.textContent = "⚪";
        el.style.color = "#9ca3af";
    }
}

updateMarketStatus();
setInterval(updateMarketStatus, 60000);


/* =========================
   BACKGROUND IMAGE (SAFE)
   ========================= */

const themes = [
  "finance stock market trading",
  "ocean ship navigation horizon",
  "mountains landscape sunrise",
  "sky clouds sunset aerial",
  "space galaxy stars universe",
  "city skyline night lights",
  "technology data system digital"
];

function setBg(url) {
    document.body.style.backgroundImage = `url('${url}')`;
}

const saved = JSON.parse(localStorage.getItem("bg_data") || "null");
const now = Date.now();
const THIRTY_MIN = 30 * 60 * 1000;

if (saved && (now - saved.time < THIRTY_MIN)) {
    setBg(saved.url);
} else {
    const query = themes[Math.floor(Math.random() * themes.length)];

    const url = `https://source.unsplash.com/1600x900/?${encodeURIComponent(query)}`;

    setBg(url);

    localStorage.setItem("bg_data", JSON.stringify({
        url,
        time: now
    }));
}


/* =========================
   QUOTE (FAIL SAFE)
   ========================= */

const quoteEl = document.getElementById("quote");

const controller = new AbortController();
const timeout = setTimeout(() => controller.abort(), 5000);

fetch("https://api.quotable.io/random", {
    signal: controller.signal
})
.then(res => {
    clearTimeout(timeout);
    if (!res.ok) throw new Error("HTTP error");
    return res.json();
})
.then(data => {
    quoteEl.innerText = data.content;
})
.catch(() => {
    quoteEl.innerText = "Discipline beats prediction.";
});

</script>

</body>
</html>
