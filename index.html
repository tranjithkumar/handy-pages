<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handy Pages</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        padding: 40px;
        background: #0f172a; /* clean dark base */
        color: white;
    }

    .header {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #market-status {
        font-size: 10px;   /* SMALL ICON FIX */
        line-height: 1;
    }

    .welcome {
        font-size: 18px;
        font-weight: bold;
    }

    #quote {
        margin-top: 15px;
        margin-bottom: 30px;
        color: #cbd5e1;
        font-style: italic;
    }

    button {
        width: 140px;
        height: 40px;
        font-size: 13px;
        cursor: pointer;
        display: block;
        margin-bottom: 12px;
        background: #1e293b;
        color: white;
        border: 1px solid #334155;
        border-radius: 6px;
    }

    button:hover {
        background: #334155;
    }
</style>
</head>

<body>

<div class="header">
    <span id="market-status">⚪</span>
    <span class="welcome">Welcome Back Boss</span>
</div>

<p id="quote">Loading quote...</p>

<button onclick="location.href='screeners/swing.html'">
    SWING
</button>

<button onclick="location.href='screeners/after2pm.html'">
    AFTER2PM
</button>

<script>

/* =========================
   MARKET STATUS (IST)
   ========================= */

function isMarketOpen() {
    const now = new Date();

    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    const ist = new Date(utc + (5.5 * 60 * 60 * 1000));

    const day = ist.getDay();
    const hour = ist.getHours();
    const min = ist.getMinutes();

    if (day === 0 || day === 6) return false;

    const current = hour * 60 + min;
    const open = 9 * 60 + 15;
    const close = 15 * 60 + 30;

    return current >= open && current <= close;
}

function updateMarketStatus() {
    const el = document.getElementById("market-status");

    if (isMarketOpen()) {
        el.textContent = "🟢";
        el.style.color = "#22c55e";
    } else {
        el.textContent = "⚪";
        el.style.color = "#9ca3af";
    }
}

updateMarketStatus();
setInterval(updateMarketStatus, 60000);


/* =========================
   RANDOM QUOTE
   ========================= */

fetch("https://api.quotable.io/random")
    .then(res => res.json())
    .then(data => {
        document.getElementById("quote").innerText = data.content;
    })
    .catch(() => {
        document.getElementById("quote").innerText =
            "Discipline beats prediction.";
    });

</script>

</body>
</html>
