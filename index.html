<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handy Pages</title><style>
    body {
        font-family: Arial, sans-serif;
        padding: 40px;
        background: #f5f5f5;

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .header {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    #market-status {
        color: #22c55e;
        font-size: 22px;
    }

    .welcome {
        font-size: 20px;
        font-weight: bold;
    }

    #quote {
        margin-top: 15px;
        margin-bottom: 30px;
        color: #555;
        font-style: italic;
    }

    button {
        width: 160px;
        height: 40px;
        font-size: 14px;
        cursor: pointer;
        display: block;
        margin-bottom: 15px;
    }
</style>

</head>
<body><div class="header">
    <span id="market-status">●</span>
    <span class="welcome">Welcome Back Boss</span>
</div><p id="quote"></p><button onclick="location.href='screeners/swing.html'">
    SWING
</button><button onclick="location.href='screeners/after2pm.html'">
    AFTER2PM
</button><script>
const quotes = [
    "Protect capital first. Growth comes second.",
    "The market rewards discipline.",
    "Patience compounds.",
    "Strong trends require strong conviction."
];

document.getElementById("quote").innerText =
    quotes[Math.floor(Math.random() * quotes.length)];
</script></body>
</html>
