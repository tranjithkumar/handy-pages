<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RK Pages</title>

<style>
body{
    margin:0;
    padding:40px;
    font-family:Arial,sans-serif;
    color:white;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:-1;
}

.header{
    display:flex;
    align-items:center;
    gap:10px;
}

#market-status{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#9ca3af;
    display:inline-block;
}

.welcome{
    font-size:22px;
    font-weight:bold;
}

#quote{
    margin-top:15px;
    margin-bottom:30px;
    color:#f1f5f9;
    font-style:italic;
    max-width:600px;
}

.game-buttons{
    position:fixed;
    bottom:24px;
    right:24px;
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:10;
}

.game-btn{
    width:48px;
    height:48px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:rgba(15,23,42,0.75);
    color:white;
    font-size:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    backdrop-filter:blur(6px);
    transition:transform 0.15s, background 0.15s;
    position:relative;
}

.game-btn:hover{
    background:rgba(15,23,42,0.95);
    transform:scale(1.12);
}

.game-btn .tooltip{
    position:absolute;
    right:58px;
    background:rgba(15,23,42,0.9);
    color:white;
    font-size:12px;
    font-weight:bold;
    padding:4px 10px;
    border-radius:4px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.15s;
}

.game-btn:hover .tooltip{
    opacity:1;
}
</style>
</head>

<body>

<div class="header">
    <span id="market-status"></span>
    <span class="welcome">Welcome Back Boss</span>
</div>

<p id="quote"></p>

<div class="game-buttons">
    <button class="game-btn" onclick="location.href='chess/index.html'">
        ♟
        <span class="tooltip">Chess</span>
    </button>
    <button class="game-btn" onclick="location.href='parking/index.html'">
        🚖
        <span class="tooltip">Bombay Taxi</span>
    </button>
</div>

<script>

/* MARKET STATUS */

function isMarketOpen(){

    const now = new Date();

    const utc =
        now.getTime() +
        now.getTimezoneOffset()*60000;

    const ist =
        new Date(utc + 19800000);

    const day = ist.getDay();

    if(day === 0 || day === 6){
        return false;
    }

    const current =
        ist.getHours()*60 +
        ist.getMinutes();

    const open = 9*60 + 15;
    const close = 15*60 + 30;

    return current >= open &&
           current <= close;
}

function updateMarketStatus(){

    const dot =
        document.getElementById(
            "market-status"
        );

    dot.style.background =
        isMarketOpen()
            ? "#22c55e"
            : "#9ca3af";
}

updateMarketStatus();
setInterval(updateMarketStatus,60000);


/* QUOTES */

const quotes = [

"Protect capital first. Growth comes second.",
"Risk management is survival.",
"The market rewards discipline.",
"Patience compounds.",
"Process over prediction.",
"Cash is a position.",
"Strong trends require strong conviction.",
"Consistency beats intensity.",
"Cut losses. Let winners work.",
"Focus on risk before reward.",
"A good system beats a good guess.",
"Trade what is happening, not what should happen.",
"Small losses are business expenses.",
"Survival creates opportunity.",
"The trend is your ally.",
"Price pays. Opinions don't.",
"Risk first. Return second.",
"Winners run. Losers exit.",
"Protect downside aggressively.",
"Discipline compounds faster than excitement."
];

const usedQuotes =
    JSON.parse(
        localStorage.getItem("usedQuotes")
    ) || [];

let availableQuotes =
    quotes.filter(
        q => !usedQuotes.includes(q)
    );

if(availableQuotes.length === 0){
    localStorage.removeItem("usedQuotes");
    availableQuotes = [...quotes];
}

const selectedQuote =
    availableQuotes[
        Math.floor(
            Math.random()*availableQuotes.length
        )
    ];

document.getElementById("quote")
    .innerText = selectedQuote;

usedQuotes.push(selectedQuote);

localStorage.setItem(
    "usedQuotes",
    JSON.stringify(usedQuotes)
);


/* BACKGROUND */

const period =
    Math.floor(
        Date.now() /
        (10*60*1000)
    );

document.body.style.backgroundImage =
`url("https://picsum.photos/1600/900?random=${period}")`;

</script>

</body>
</html>
