<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Truck Simulator</title>

<style>

html,body{
margin:0;
overflow:hidden;
background:#87ceeb;
font-family:Arial;
}

canvas{
display:block;
}

#ui{
position:absolute;
top:10px;
left:10px;

color:white;

background:rgba(0,0,0,.45);

padding:12px;

border-radius:10px;

line-height:1.7;
}

button{

padding:8px 12px;

cursor:pointer;

}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

<div>Speed: <span id="speed">0</span> km/h</div>

<div>Distance: <span id="dist">0</span> km</div>

<div>Cargo: <span id="cargo">100</span>%</div>

<button onclick="resetGame()">
Restart
</button>

</div>

<script>

const c=
document
.getElementById(
"game"
);

const x=
c.getContext(
"2d"
);

function size(){

c.width=
innerWidth;

c.height=
innerHeight;

}

size();

addEventListener(
"resize",
size
);

let keys={};

addEventListener(
"keydown",
e=>keys[e.key]=1
);

addEventListener(
"keyup",
e=>keys[e.key]=0
);

let truck;

let road;

let distance;

let cargo;

function resetGame(){

truck={

x:0,

speed:0,

angle:0

};

road=0;

distance=0;

cargo=100;

}

resetGame();

function update(){

if(
keys.ArrowUp||
keys.w
){

truck.speed+=.12;

}

if(
keys.ArrowDown||
keys.s
){

truck.speed-=.18;

}

truck.speed*=.985;

truck.speed=
Math.max(
-3,
Math.min(
12,
truck.speed
)
);

if(
keys.ArrowLeft||
keys.a
){

truck.x-=
3+
truck.speed*.4;

}

if(
keys.ArrowRight||
keys.d
){

truck.x+=
3+
truck.speed*.4;

}

truck.x=
Math.max(
-260,
Math.min(
260,
truck.x
)
);

road+=
truck.speed*6;

distance+=
Math.max(
0,
truck.speed
)*0.02;

if(
Math.abs(
truck.x
)>180
){

cargo-=
0.06*
truck.speed;

}

cargo=
Math.max(
0,
cargo
);

document
.getElementById(
"speed"
)
.textContent=
Math.round(
truck.speed*10
);

document
.getElementById(
"dist"
)
.textContent=
distance
.toFixed(1);

document
.getElementById(
"cargo"
)
.textContent=
cargo
.toFixed(0);

}

function drawRoad(){

x.fillStyle=
"#87ceeb";

x.fillRect(
0,
0,
c.width,
c.height
);

x.fillStyle=
"#4b8b3b";

x.fillRect(
0,
c.height*.45,
c.width,
c.height
);

for(
let y=
c.height*.45;
y<
c.height;
y+=8
){

let p=
(y-
c.height*.45)/
(c.height*.55);

let rw=
150+
p*900;

let cx=
c.width/2
+
truck.x*
p;

x.fillStyle=
"#444";

x.fillRect(

cx-rw/2,

y,

rw,

10

);

x.strokeStyle=
"white";

x.lineWidth=
3;

if(
Math.floor(
(y+road)%60
)<30
){

x.beginPath();

x.moveTo(
cx,
y
);

x.lineTo(
cx,
y+10
);

x.stroke();

}

}

}

function drawTruck(){

let y=
c.height*.78;

let tx=
c.width/2;

x.save();

x.translate(
tx,
y
);

x.fillStyle=
"#d72626";

x.fillRect(
-45,
-55,
90,
110
);

x.fillStyle=
"#ddd";

x.fillRect(
-32,
-42,
64,
28
);

x.fillStyle=
"#222";

x.fillRect(
-48,
-58,
96,
12
);

x.beginPath();

x.arc(
-34,
58,
14,
0,
7
);

x.arc(
34,
58,
14,
0,
7
);

x.fill();

x.restore();

}

function draw(){

drawRoad();

drawTruck();

if(
cargo<=0
){

x.fillStyle=
"rgba(0,0,0,.7)";

x.fillRect(
0,
0,
c.width,
c.height
);

x.fillStyle=
"white";

x.font=
"50px Arial";

x.fillText(

"Cargo Lost",

c.width/2-140,

c.height/2

);

x.font=
"22px Arial";

x.fillText(

"Press Restart",

c.width/2-85,

c.height/2+45

);

return;

}

update();

requestAnimationFrame(
draw
);

}

draw();

</script>

</body>
</html>
