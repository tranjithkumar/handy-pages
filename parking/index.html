<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bombay Taxi — RK Pages</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

.top-bar{
    width:100%;
    max-width:420px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.back-btn{
    background:rgba(255,255,255,0.08);
    border:none;
    color:white;
    padding:6px 14px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
}
.back-btn:hover{background:rgba(255,255,255,0.15)}

.title{font-size:18px;font-weight:bold}

.meta{
    font-size:13px;
    color:#94a3b8;
    text-align:right;
}

#grid-wrap{
    position:relative;
    touch-action:none;
}

canvas{
    display:block;
    border-radius:6px;
}

.controls{
    margin-top:14px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
}

.ctrl-btn{
    background:rgba(255,255,255,0.08);
    border:none;
    color:white;
    padding:8px 18px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    font-weight:bold;
}
.ctrl-btn:hover{background:rgba(255,255,255,0.18)}

.level-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:10px;
    max-width:420px;
}

.lv-btn{
    width:36px;height:36px;
    border-radius:6px;
    border:none;
    background:rgba(255,255,255,0.08);
    color:#94a3b8;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}
.lv-btn.done{background:rgba(34,197,94,0.25);color:#4ade80}
.lv-btn.active{background:rgba(234,179,8,0.3);color:#fde047}
.lv-btn:hover{background:rgba(255,255,255,0.18);color:white}

.win-msg{
    margin-top:12px;
    font-size:15px;
    font-weight:bold;
    color:#4ade80;
    min-height:22px;
    text-align:center;
}
</style>
</head>
<body>

<div class="top-bar">
    <button class="back-btn" onclick="location.href='../index.html'">← Home</button>
    <span class="title">🚖 Bombay Taxi</span>
    <div class="meta">
        <div id="lv-label">Level 1</div>
        <div id="moves-label">Moves: 0</div>
    </div>
</div>

<div id="grid-wrap">
    <canvas id="c"></canvas>
</div>

<div class="win-msg" id="win-msg"></div>

<div class="controls">
    <button class="ctrl-btn" onclick="restartLevel()">Restart</button>
    <button class="ctrl-btn" onclick="nextLevel()">Next →</button>
</div>

<div class="level-row" id="level-row"></div>

<script>
const COLS=6,ROWS=6;
let CELL;

const LEVELS=[
    {
        cars:[
            {id:0,r:2,c:0,len:2,dir:'h',taxi:true},
            {id:1,r:0,c:1,len:2,dir:'v'},
            {id:2,r:0,c:3,len:2,dir:'v'},
            {id:3,r:3,c:2,len:2,dir:'h'},
            {id:4,r:4,c:0,len:2,dir:'v'},
            {id:5,r:4,c:4,len:2,dir:'v'},
        ],
        exit:{r:2,side:'right'}
    },
    {
        cars:[
            {id:0,r:2,c:0,len:2,dir:'h',taxi:true},
            {id:1,r:0,c:2,len:3,dir:'v'},
            {id:2,r:3,c:2,len:2,dir:'h'},
            {id:3,r:1,c:4,len:2,dir:'v'},
            {id:4,r:4,c:0,len:2,dir:'h'},
            {id:5,r:0,c:5,len:2,dir:'v'},
        ],
        exit:{r:2,side:'right'}
    },
    {
        cars:[
            {id:0,r:2,c:1,len:2,dir:'h',taxi:true},
            {id:1,r:0,c:3,len:3,dir:'v'},
            {id:2,r:0,c:1,len:2,dir:'v'},
            {id:3,r:3,c:0,len:2,dir:'h'},
            {id:4,r:4,c:3,len:2,dir:'h'},
            {id:5,r:1,c:5,len:3,dir:'v'},
            {id:6,r:4,c:1,len:2,dir:'v'},
        ],
        exit:{r:2,side:'right'}
    },
    {
        cars:[
            {id:0,r:2,c:0,len:2,dir:'h',taxi:true},
            {id:1,r:0,c:2,len:2,dir:'v'},
            {id:2,r:2,c:3,len:2,dir:'v'},
            {id:3,r:0,c:4,len:3,dir:'v'},
            {id:4,r:3,c:1,len:3,dir:'h'},
            {id:5,r:5,c:0,len:2,dir:'h'},
            {id:6,r:0,c:0,len:2,dir:'v'},
        ],
        exit:{r:2,side:'right'}
    },
    {
        cars:[
            {id:0,r:2,c:0,len:2,dir:'h',taxi:true},
            {id:1,r:0,c:1,len:3,dir:'v'},
            {id:2,r:0,c:3,len:2,dir:'h'},
            {id:3,r:1,c:4,len:3,dir:'v'},
            {id:4,r:3,c:2,len:3,dir:'h'},
            {id:5,r:4,c:0,len:2,dir:'h'},
            {id:6,r:3,c:5,len:3,dir:'v'},
            {id:7,r:0,c:5,len:1,dir:'v'},
        ],
        exit:{r:2,side:'right'}
    },
    {
        cars:[
            {id:0,r:2,c:0,len:2,dir:'h',taxi:true},
            {id:1,r:0,c:0,len:2,dir:'h'},
            {id:2,r:0,c:2,len:3,dir:'v'},
            {id:3,r:0,c:4,len:2,dir:'h'},
            {id:4,r:1,c:5,len:2,dir:'v'},
            {id:5,r:3,c:3,len:3,dir:'h'},
            {id:6,r:4,c:1,len:2,dir:'v'},
            {id:7,r:5,c:3,len:3,dir:'h'},
        ],
        exit:{r:2,side:'right'}
    },
    {
        cars:[
            {id:0,r:3,c:0,len:2,dir:'h',taxi:true},
            {id:1,r:0,c:1,len:2,dir:'v'},
            {id:2,r:2,c:1,len:2,dir:'v'},
            {id:3,r:4,c:1,len:2,dir:'v'},
            {id:4,r:0,c:3,len:3,dir:'v'},
            {id:5,r:3,c:3,len:2,dir:'h'},
            {id:6,r:1,c:5,len:2,dir:'v'},
            {id:7,r:4,c:4,len:2,dir:'h'},
        ],
        exit:{r:3,side:'right'}
    },
    {
        cars:[
            {id:0,r:2,c:0,len:2,dir:'h',taxi:true},
            {id:1,r:0,c:0,len:2,dir:'v'},
            {id:2,r:0,c:2,len:2,dir:'h'},
            {id:3,r:0,c:4,len:3,dir:'v'},
            {id:4,r:1,c:2,len:2,dir:'v'},
            {id:5,r:2,c:3,len:2,dir:'h'},
            {id:6,r:3,c:1,len:2,dir:'h'},
            {id:7,r:4,c:0,len:2,dir:'v'},
            {id:8,r:4,c:3,len:3,dir:'h'},
        ],
        exit:{r:2,side:'right'}
    },
];

let currentLevel=0;
let cars=[];
let moves=0;
let won=false;
let solved=JSON.parse(localStorage.getItem('btSolved')||'[]');

let drag=null;
let dragStartCell=null;
let dragStartMouse=null;

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

function calcCell(){
    const vw=Math.min(window.innerWidth-40,420);
    CELL=Math.floor(vw/COLS);
    canvas.width=CELL*COLS;
    canvas.height=CELL*ROWS;
}

function deepCopy(lvl){
    return lvl.cars.map(c=>({...c}));
}

function loadLevel(idx){
    currentLevel=idx;
    const lvl=LEVELS[idx];
    cars=deepCopy(lvl);
    moves=0;won=false;
    document.getElementById('win-msg').textContent='';
    document.getElementById('lv-label').textContent='Level '+(idx+1);
    document.getElementById('moves-label').textContent='Moves: 0';
    buildLevelButtons();
    draw();
}

function restartLevel(){loadLevel(currentLevel);}

function nextLevel(){
    if(currentLevel<LEVELS.length-1)loadLevel(currentLevel+1);
}

function buildLevelButtons(){
    const row=document.getElementById('level-row');
    row.innerHTML='';
    LEVELS.forEach((_,i)=>{
        const b=document.createElement('button');
        b.className='lv-btn'+(solved.includes(i)?' done':'')+(i===currentLevel?' active':'');
        b.textContent=i+1;
        b.onclick=()=>loadLevel(i);
        row.appendChild(b);
    });
}

const COLORS=[
    '#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6',
    '#1abc9c','#e67e22','#e91e63','#00bcd4','#8bc34a'
];
const TAXI_COLOR='#f5c518';

function draw(){
    const W=canvas.width,H=canvas.height;
    ctx.clearRect(0,0,W,H);

    ctx.fillStyle='#1e293b';
    ctx.beginPath();
    ctx.roundRect(0,0,W,H,6);
    ctx.fill();

    for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
            ctx.fillStyle=(r+c)%2===0?'#263248':'#1e2a40';
            ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
        }
    }

    const lvl=LEVELS[currentLevel];
    const exitR=lvl.exit.r;
    ctx.fillStyle='#4ade80';
    ctx.fillRect(W,exitR*CELL+CELL*0.15,12,CELL*0.7);

    ctx.strokeStyle='#0f172a';
    ctx.lineWidth=1;
    for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*CELL);ctx.lineTo(W,r*CELL);ctx.stroke();}
    for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*CELL,0);ctx.lineTo(c*CELL,H);ctx.stroke();}

    cars.forEach((car,i)=>{
        const pad=4;
        const x=car.c*CELL+pad;
        const y=car.r*CELL+pad;
        const w=car.dir==='h'?car.len*CELL-pad*2:CELL-pad*2;
        const h=car.dir==='v'?car.len*CELL-pad*2:CELL-pad*2;
        const color=car.taxi?TAXI_COLOR:COLORS[i%COLORS.length];

        ctx.fillStyle=color;
        ctx.beginPath();
        ctx.roundRect(x,y,w,h,6);
        ctx.fill();

        ctx.fillStyle='rgba(0,0,0,0.25)';
        ctx.beginPath();
        if(car.dir==='h'){
            ctx.roundRect(x+w-14,y+4,8,h-8,3);
        }else{
            ctx.roundRect(x+4,y+h-14,w-8,8,3);
        }
        ctx.fill();

        if(car.taxi){
            ctx.fillStyle='#0f172a';
            ctx.font=`bold ${Math.floor(CELL*0.38)}px Arial`;
            ctx.textAlign='center';
            ctx.textBaseline='middle';
            ctx.fillText('TAXI',x+w/2,y+h/2);
        }
    });
}

function getCarAt(r,c){
    for(let i=0;i<cars.length;i++){
        const car=cars[i];
        if(car.dir==='h'){
            if(car.r===r&&c>=car.c&&c<car.c+car.len)return i;
        }else{
            if(car.c===c&&r>=car.r&&r<car.r+car.len)return i;
        }
    }
    return -1;
}

function canMove(idx,delta){
    const car=cars[idx];
    const nb=[...cars];
    if(car.dir==='h'){
        const nc=car.c+delta;
        if(nc<0||nc+car.len>COLS)return false;
        for(let j=0;j<cars.length;j++){
            if(j===idx)continue;
            const o=cars[j];
            for(let k=nc;k<nc+car.len;k++){
                if(o.dir==='h'&&o.r===car.r&&k>=o.c&&k<o.c+o.len)return false;
                if(o.dir==='v'&&o.c===k&&car.r>=o.r&&car.r<o.r+o.len)return false;
            }
        }
    }else{
        const nr=car.r+delta;
        if(nr<0||nr+car.len>ROWS)return false;
        for(let j=0;j<cars.length;j++){
            if(j===idx)continue;
            const o=cars[j];
            for(let k=nr;k<nr+car.len;k++){
                if(o.dir==='v'&&o.c===car.c&&k>=o.r&&k<o.r+o.len)return false;
                if(o.dir==='h'&&o.r===k&&car.c>=o.c&&car.c<o.c+o.len)return false;
            }
        }
    }
    return true;
}

function moveCar(idx,delta){
    const car=cars[idx];
    if(car.dir==='h')car.c+=delta;
    else car.r+=delta;
    moves++;
    document.getElementById('moves-label').textContent='Moves: '+moves;
    checkWin();
    draw();
}

function checkWin(){
    const taxi=cars.find(c=>c.taxi);
    const lvl=LEVELS[currentLevel];
    if(!taxi||won)return;
    if(taxi.r===lvl.exit.r&&taxi.c+taxi.len===COLS){
        won=true;
        document.getElementById('win-msg').textContent='You escaped! '+moves+' moves 🎉';
        if(!solved.includes(currentLevel)){
            solved.push(currentLevel);
            localStorage.setItem('btSolved',JSON.stringify(solved));
        }
        buildLevelButtons();
    }
}

function getMouseCell(e){
    const rect=canvas.getBoundingClientRect();
    const ex=e.clientX??e.touches[0].clientX;
    const ey=e.clientY??e.touches[0].clientY;
    return{
        r:Math.floor((ey-rect.top)/CELL),
        c:Math.floor((ex-rect.left)/CELL),
        px:ex-rect.left,
        py:ey-rect.top
    };
}

canvas.addEventListener('mousedown',startDrag);
canvas.addEventListener('touchstart',e=>{e.preventDefault();startDrag(e);},{passive:false});

function startDrag(e){
    if(won)return;
    const {r,c,px,py}=getMouseCell(e);
    const idx=getCarAt(r,c);
    if(idx<0)return;
    drag={idx,moved:false};
    dragStartCell={r,c};
    dragStartMouse={px,py};
}

window.addEventListener('mousemove',onDrag);
window.addEventListener('touchmove',e=>{e.preventDefault();onDrag(e);},{passive:false});

function onDrag(e){
    if(!drag)return;
    const rect=canvas.getBoundingClientRect();
    const ex=e.clientX??e.touches[0].clientX;
    const ey=e.clientY??e.touches[0].clientY;
    const px=ex-rect.left;
    const py=ey-rect.top;
    const car=cars[drag.idx];
    const dx=Math.round((px-dragStartMouse.px)/CELL);
    const dy=Math.round((py-dragStartMouse.py)/CELL);
    const delta=car.dir==='h'?dx:dy;
    if(delta===0)return;
    const step=delta>0?1:-1;
    for(let s=0;s<Math.abs(delta);s++){
        if(canMove(drag.idx,step)){moveCar(drag.idx,step);drag.moved=true;}
    }
    dragStartMouse={px,py};
}

window.addEventListener('mouseup',endDrag);
window.addEventListener('touchend',endDrag);
function endDrag(){drag=null;}

window.addEventListener('resize',()=>{calcCell();draw();});

calcCell();
loadLevel(0);
</script>
</body>
</html>
