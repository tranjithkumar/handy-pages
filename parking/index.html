```html
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parking Game</title>

<style>
body{
margin:0;
overflow:hidden;
background:#222;
font-family:Arial;
}

canvas{
display:block;
background:#5d5d5d;
}

#ui{
position:absolute;
top:10px;
left:10px;

background:rgba(0,0,0,.7);

color:white;

padding:10px;

border-radius:10px;
}

button{
padding:8px 12px;
margin-top:8px;
cursor:pointer;
}
</style>
</head>

<body>

<canvas id="g"></canvas>

<div id="ui">
<div>Arrow Keys / WASD</div>
<div id="msg">Park inside the green box</div>
<button onclick="reset()">Restart</button>
</div>

<script>

const c=document.getElementById("g");
const x=c.getContext("2d");

function resize(){
c.width=innerWidth;
c.height=innerHeight;
}

resize();
addEventListener("resize",resize);

let keys={};

addEventListener(
"keydown",
e=>keys[e.key]=true
);

addEventListener(
"keyup",
e=>keys[e.key]=false
);

let car;
let target;

function reset(){

car={
x:120,
y:c.height-140,
a:-1.57,
speed:0
};

target={
x:c.width-220,
y:120,
w:120,
h:180
};

document
.getElementById("msg")
.textContent=
"Park inside the green box";

}

function update(){

if(keys.ArrowUp||keys.w)
car.speed+=0.12;

if(keys.ArrowDown||keys.s)
car.speed-=0.08;

car.speed*=0.96;

car.speed=
Math.max(
-2,
Math.min(
5,
car.speed
));

if(keys.ArrowLeft||keys.a)
car.a-=0.05;

if(keys.ArrowRight||keys.d)
car.a+=0.05;

car.x+=
Math.cos(car.a)
*
car.speed;

car.y+=
Math.sin(car.a)
*
car.speed;

}

function parked(){

let inside=
car.x>
target.x &&
car.x<
target.x+
target.w &&

car.y>
target.y &&
car.y<
target.y+
target.h;

return inside &&
Math.abs(
car.speed
)<0.4;

}

function drawLot(){

x.fillStyle="#7a7a7a";

x.fillRect(
0,
0,
c.width,
c.height
);

x.strokeStyle="#ffffff";

for(
let i=0;
i<10;
i++
){

x.strokeRect(
60+i*140,
80,
100,
180
);

}

x.strokeStyle=
"#00ff55";

x.lineWidth=5;

x.strokeRect(
target.x,
target.y,
target.w,
target.h
);

}

function drawCar(){

x.save();

x.translate(
car.x,
car.y
);

x.rotate(
car.a
);

x.fillStyle=
"#e53935";

x.fillRect(
-20,
-35,
40,
70
);

x.fillStyle=
"#cfd8dc";

x.fillRect(
-14,
-20,
28,
28
);

x.restore();

}

function loop(){

update();

drawLot();

drawCar();

if(parked()){

document
.getElementById(
"msg"
)
.textContent=
"Perfect Parking ✓";

}

requestAnimationFrame(
loop
);

}

reset();

loop();

</script>

</body>
</html>
