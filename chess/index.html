```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline Chess</title>

<style>

body{
margin:0;
background:#111;
font-family:Arial;
color:white;

display:flex;
flex-direction:column;

align-items:center;

padding:20px;
}

h1{
margin:8px;
}

#board{

display:grid;

grid-template-columns:
repeat(8,70px);

border:4px solid #333;

}

.cell{

width:70px;

height:70px;

display:flex;

justify-content:center;

align-items:center;

font-size:44px;

cursor:pointer;

user-select:none;

}

.white{
background:#f0d9b5;
}

.black{
background:#b58863;
}

.sel{

outline:4px solid yellow;

}

.controls{

margin-top:15px;

display:flex;

gap:10px;

}

button{

padding:10px;

cursor:pointer;

}

#status{

margin-top:10px;

}

</style>

</head>

<body>

<h1>♟ Chess</h1>

<div id="board"></div>

<div class="controls">

<button onclick="newGame()">
New Game
</button>

<button onclick="undo()">
Undo
</button>

</div>

<div id="status"></div>

<script>

const U={

K:"♔",
Q:"♕",
R:"♖",
B:"♗",
N:"♘",
P:"♙",

k:"♚",
q:"♛",
r:"♜",
b:"♝",
n:"♞",
p:"♟"

};

let board=[];

let selected=null;

let history=[];

function resetBoard(){

return [

["r","n","b","q","k","b","n","r"],

["p","p","p","p","p","p","p","p"],

["","","","","","","",""],

["","","","","","","",""],

["","","","","","","",""],

["","","","","","","",""],

["P","P","P","P","P","P","P","P"],

["R","N","B","Q","K","B","N","R"]

];

}

function draw(){

const root=
document
.getElementById(
"board"
);

root.innerHTML="";

for(
let r=0;
r<8;
r++
){

for(
let c=0;
c<8;
c++
){

const d=
document
.createElement(
"div"
);

d.className=
"cell "+
(
(r+c)%2
?
"black"
:
"white"
);

if(
selected&&
selected[0]==r&&
selected[1]==c
){

d.classList.add(
"sel"
);

}

d.textContent=
U[
board[r][c]
]||"";

d.onclick=
()=>tap(
r,
c
);

root.appendChild(
d
);

}

}

}

function isWhite(p){

return p&&
p===p.toUpperCase();

}

function isBlack(p){

return p&&
p===p.toLowerCase();

}

function tap(r,c){

if(

selected

){

history.push(
JSON.stringify(
board
)
);

board[r][c]=

board[
selected[0]
][
selected[1]
];

board[
selected[0]
][
selected[1]
]="";

selected=null;

draw();

setTimeout(
ai,
300
);

return;

}

if(
isWhite(
board[r][c]
)
){

selected=
[
r,
c
];

draw();

}

}

function ai(){

let pieces=[];

for(
let r=0;
r<8;
r++
){

for(
let c=0;
c<8;
c++
){

if(
isBlack(
board[r][c]
)
){

pieces.push(
[
r,
c
]
);

}

}

}

if(
!pieces.length
){

status(
"You win"
);

return;

}

let p=
pieces[
Math.floor(
Math.random()
*
pieces.length
)
];

let dirs=[

[-1,0],
[1,0],

[0,-1],
[0,1]

];

let d=
dirs[
Math.floor(
Math.random()
*
dirs.length
)
];

let nr=
Math.max(
0,
Math.min(
7,
p[0]+d[0]
)
);

let nc=
Math.max(
0,
Math.min(
7,
p[1]+d[1]
)
);

board[nr][nc]=
board[
p[0]
][
p[1]
];

board[
p[0]
][
p[1]
]="";

draw();

status(
"Your turn"
);

}

function undo(){

if(
history.length
){

board=
JSON.parse(
history.pop()
);

draw();

}

}

function status(t){

document
.getElementById(
"status"
)
.textContent=t;

}

function newGame(){

board=
resetBoard();

selected=null;

history=[];

draw();

status(
"Your turn"
);

}

newGame();

</script>

</body>
</html>
