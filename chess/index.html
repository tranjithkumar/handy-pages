```html
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess</title>

<style>
body{
margin:0;
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

.screen{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

button{
padding:12px 20px;
font-size:16px;
cursor:pointer;
margin:6px;
}

#game{
display:none;
padding:20px;
}

#board{
display:grid;
grid-template-columns:repeat(8,70px);
justify-content:center;
}

.cell{
width:70px;
height:70px;
display:flex;
align-items:center;
justify-content:center;
font-size:42px;
cursor:pointer;
user-select:none;
}

.w{background:#f0d9b5;}
.b{background:#b58863;}

.sel{
outline:4px solid yellow;
}

</style>
</head>

<body>

<div id="home" class="screen">

<h1>♟ Chess</h1>

<button onclick="startGame()">
Play
</button>

</div>

<div id="game">

<h2 id="turn"></h2>

<div id="board"></div>

<div>

<button onclick="newGame()">
New Game
</button>

<button onclick="undoMove()">
Undo
</button>

<button onclick="goHome()">
Home
</button>

</div>

</div>

<script>

const U={
K:"♔",Q:"♕",R:"♖",B:"♗",N:"♘",P:"♙",
k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"
};

let board=[];
let selected=null;
let turn="white";
let history=[];

function initial(){

return [

["r","n","b","q","k","b","n","r"],

["p","p","p","p","p","p","p","p"],

["","","","","","","",""],

["","","","","","","",""],

["","","","","","","",""],

["","","","","","","",""],

["P","P","P","P","P","P","P","P"],

["R","N","B","Q","K","B","N","R"]

];

}

function startGame(){

document.getElementById(
"home"
).style.display="none";

document.getElementById(
"game"
).style.display="block";

newGame();

}

function goHome(){

document.getElementById(
"game"
).style.display="none";

document.getElementById(
"home"
).style.display="flex";

}

function newGame(){

board=initial();

history=[];

selected=null;

turn="white";

draw();

}

function draw(){

document.getElementById(
"turn"
).textContent=
turn.toUpperCase()+" TURN";

const root=
document.getElementById(
"board"
);

root.innerHTML="";

for(let r=0;r<8;r++){

for(let c=0;c<8;c++){

const d=
document.createElement(
"div"
);

d.className=
"cell "+
((r+c)%2?"b":"w");

if(
selected&&
selected[0]===r&&
selected[1]===c
){

d.classList.add(
"sel"
);

}

d.textContent=
U[
board[r][c]
]||"";

d.onclick=
()=>clickCell(
r,
c
);

root.appendChild(
d);

}

}

}

function white(p){

return p&&
p===p.toUpperCase();

}

function black(p){

return p&&
p===p.toLowerCase();

}

function own(p){

return turn==="white"
?
white(p)
:
black(p);

}

function clickCell(r,c){

let p=
board[r][c];

if(selected){

history.push(
JSON.stringify(
board
)
);

board[r][c]=
board[
selected[0]
][
selected[1]
];

board[
selected[0]
][
selected[1]
]="";

selected=null;

turn=
turn==="white"
?
"black"
:
"white";

draw();

return;

}

if(
own(p)
){

selected=[r,c];

draw();

}

}

function undoMove(){

if(
history.length
){

board=
JSON.parse(
history.pop()
);

turn=
turn==="white"
?
"black"
:
"white";

selected=null;

draw();

}

}

</script>

</body>
</html>
```
