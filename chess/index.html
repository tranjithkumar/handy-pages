<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chess</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

h1{
    margin-bottom:10px;
}

#board{
    width:min(90vw,600px);
}

.controls{
    margin-top:15px;
    display:flex;
    gap:10px;
}

button{
    padding:10px 16px;
    cursor:pointer;
}

#status{
    margin-top:12px;
}
</style>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/chessboard.js/1.0.0/chessboard.min.css">

</head>

<body>

<h1>♟ Chess</h1>

<div id="board"></div>

<div class="controls">
<button onclick="undoMove()">Undo</button>
<button onclick="newGame()">New Game</button>
</div>

<div id="status"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard.js/1.0.0/chessboard.min.js"></script>

<script>

const game = new Chess();

let board = Chessboard("board",{
    draggable:true,
    position:"start",

    onDrop:(source,target)=>{

        const move = game.move({
            from:source,
            to:target,
            promotion:"q"
        });

        if(move===null){
            return "snapback";
        }

        updateStatus();
    },

    onSnapEnd:()=>{
        board.position(game.fen());
    }
});

function updateStatus(){

let text="";

if(game.in_checkmate()){
text="Checkmate";
}
else if(game.in_draw()){
text="Draw";
}
else{
text=
(game.turn()==="w"
? "White"
: "Black")
+" to move";

if(game.in_check()){
text+=" — Check";
}
}

document.getElementById("status")
.innerText=text;

}

function undoMove(){
game.undo();
board.position(game.fen());
updateStatus();
}

function newGame(){
game.reset();
board.start();
updateStatus();
}

updateStatus();

</script>

</body>
</html>
